STR_CASE_GOAL: "Выясните, какие сведения относятся к каждому человеку. Читайте улики и ставьте галочки в таблицах с именами."
STR_CASE_RULES_TEXT: "Общий экран содержит улики, вкладки и таблицу. Удерживайте «Выбор» около секунды, чтобы переключать активную область: улики → вкладки → таблица. В таблице направления двигают курсор, короткий «Выбор» меняет отметку. В уликах Вверх/Вниз выбирают улику, Влево/Вправо листают страницы, короткий «Выбор» зачёркивает её. Удерживайте Вправо в области улик, чтобы открыть все улики по порядку. В окне Вверх/Вниз прокручивают текст, Влево/Вправо листают страницы, Выбор открывает следующую страницу. Назад закрывает окно. На вкладках направления выбирают карточку, и поле сразу показывает соответствующую таблицу. «Выбор» переводит курсор на поле. Назад на общем экране открывает меню. В каждом деле есть несколько людей. У каждого — свой вариант в каждой категории: например, свой этаж и время приезда. Прочитайте улики в меню и определите все соответствия. Кнопки направлений перемещают курсор, Выбор меняет отметку: пусто → крестик → галочка → пусто. Галочка означает «да, подходит», крестик — «нет, не подходит». Точки рядом с галочкой лишь показывают исключённые варианты. Переключайте таблицы через меню. Использованную улику можно зачеркнуть; повторное нажатие вернёт её. Условие «ровно одно из двух» означает, что верна только одна из двух фраз, а вторая неверна. В парной улике речь о двух разных людях: один подходит к первому описанию, другой — ко второму, но пока неизвестно кто. Подсказка сначала убирает ошибочную отметку, а затем ставит правильную галочку. Проверка сообщает число ошибок. Дело решено, когда в таблицах с именами у каждого человека найдены все верные варианты. Сравнения по времени учитывают ночь: в музее 00:00 идёт после 23:00. Разница в часах, этажах, днях и местах считается по всей шкале, даже если промежуточного значения нет в этом деле."
