STR_DELVE_HELP_1: "Найдите Амулет на десятом этаже. Направления двигают героя; шаг на врага — удар, на дверь — открыть. После каждого действия ходят монстры. Столкновение со стеной ход не тратит. «Назад» открывает меню, «Выбор» — рюкзак."
STR_DELVE_HELP_2: "Факел теряет единицу за ход. Ниже 100 свет слабеет; при нуле видно лишь рядом, здоровье не восстанавливается. Новые факелы дают 200 единиц. Отдых лечит до 40 ходов, но прекращается при виде врага. Меню не тратит ходы. На лестнице выберите «Спуститься»."
STR_DELVE_HELP_3: "Предметы подбираются шагом. Выберите предмет в рюкзаке, затем «Применить» или «Выбросить». Применение пьёт зелье, читает свиток или надевает снаряжение. Свойства неизвестных зелий и свитков открываются после применения. В рюкзаке 12 мест. Золото и факелы не занимают место."
STR_DELVE_HELP_4: "Смерть завершает поход. Игра сохраняется каждые 10 ходов, при спуске, открытии меню и выходе; доступны «Продолжить» и новый поход. «Подземелье дня» использует дату ридера: сначала настройте часы. Осмотр врагов показывает их силу и повадки. Delve — адаптация игры Омера Фарука Инела (MIT)."
