STR_LAMP_HELP_TEXT: "Соедините источник (квадрат) со всеми лампами. Поворачивайте клетки кнопкой «Выбор», перемещайте курсор кнопками направлений. Соберите одну сеть без свободных концов и замкнутых петель; провода не должны выходить за край поля. Подключённые провода толще, горящие лампы закрашены. В меню можно закреплять найденные положения, отменять ходы и брать подсказки. Подсказка поворачивает клетку правильно и закрепляет её навсегда до перезапуска задачи. Чтобы освободить обычную закреплённую клетку, включите «Закрепление» и выберите её. Здесь 600 задач: по 200 на полях 5×5, 7×7 и 9×9. Задачу, сложность и пройденные уровни игра сохраняет автоматически."
