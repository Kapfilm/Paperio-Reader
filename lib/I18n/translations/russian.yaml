STR_KAKURO_RULES: "Заполните белые клетки цифрами от 1 до 9. Сумма каждой горизонтальной или вертикальной цепочки должна совпасть с числом в клетке-подсказке. В одной цепочке цифры не повторяются. Сумма справа сверху относится к горизонтали, слева снизу — к вертикали.\n\nКнопки направлений перемещают курсор. «Выбор» открывает палитру цифр. Выберите цифру или X для очистки, затем нажмите «Выбор». «Назад» закрывает палитру или открывает меню игры.\n\nПод полем показаны суммы двух цепочек выбранной клетки и возможные сочетания цифр. Полный список открывается через меню «Сочетания цифр». Порядок цифр в сочетании не означает их порядок на поле.\n\nПовторы цифр и неверная сумма заполненной цепочки отмечаются крестом. Подсказка заполняет выбранную клетку или первую нерешённую. Подсказанные цифры подчёркнуты и защищены от изменения до перезапуска задачи.\n\nПо 200 задач на каждом из трёх уровней. Номер задачи, введённые цифры и пройденные задачи сохраняются автоматически."

