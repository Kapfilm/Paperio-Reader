STR_CASE_RULES_TEXT: "Hold Select to cycle focus: clues, tabs, grid. Arrows move within the focused area. Select marks a cell, crosses out a clue, or moves focus to the grid. Selecting a tab immediately changes the displayed grid. In clues, Left/Right change pages; hold Right for the complete clue list. Up/Down scroll lines, Left/Right turn pages, Select advances a page. Back closes the popup or opens the game menu. Read the clues and match people with their items. Directions move the cursor. Select cycles blank → cross → tick → blank. A cross means a mismatch; a tick means a match. Dots exclude other cells in a tick’s row and column but are not your marks. The menu switches grids, opens clues, undoes moves, checks mistakes and gives hints. Either/or means exactly one option. A pair clue assigns two different people to the other two in an unknown order. Comparisons use the original category order, including times across midnight. Solve every name grid to close the case. Museum rounds are ordered 21:00 → 22:00 → 23:00 → 00:00 → 01:00 → 02:00. Differences count the full original category, including values not selected for this case."
