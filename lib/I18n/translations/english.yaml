STR_KAKURO_RULES: "Fill white cells with digits 1–9. Every horizontal or vertical run must add up to its clue, with no repeated digit. The upper-right clue is across; the lower-left clue is down.\n\nDirections move the cursor. Select opens the digit palette; choose a digit or X to erase, then Select. Back cancels the palette or opens the game menu.\n\nBelow the board are the two selected runs and possible digit combinations. Open Digit combinations from the menu for the full list. Combination order does not imply cell order.\n\nRepeated digits and incorrect full sums are crossed. Hint fills the selected cell or the first unsolved cell. Hinted digits are underlined and protected until restarting the puzzle.\n\nThere are 200 puzzles at each of three levels. The current puzzle, digits and completion progress are saved automatically."

STR_KAKURO_UNDO: "Undo move"
