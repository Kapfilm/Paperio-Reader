STR_DELVE_HELP_1: "Find the Amulet on depth ten. Directions move the hero; step into an enemy to attack or a door to open it. Monsters act after each action. Bumping a wall costs no turn. Back opens the menu; Select opens the bag."
STR_DELVE_HELP_2: "The torch burns one point per turn. Below 100 its light shrinks. At zero, sight is limited and health does not recover. Fresh torches add 200. Rest lasts up to 40 turns and stops when an enemy appears. Menus cost no turns. Choose Descend while on stairs."
STR_DELVE_HELP_3: "Walk onto items to collect them. Select an item in the bag, then Use or Drop. Use drinks, reads or equips. Unknown potions and scrolls are identified when used. The bag holds 12 items. Gold and torches take no space."
STR_DELVE_HELP_4: "Death ends the run. Progress saves every ten turns, on descent, opening the menu and exit. Continue resumes it. Daily dungeon uses the reader date: set the clock first. Inspect enemies to learn their strength and habits. Adapted from Delve by Omer Faruk Inel (MIT)."
