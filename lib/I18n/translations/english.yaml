STR_LAMP_HELP_TEXT: "Connect the square source to every lamp. Select rotates a tile; direction buttons move the cursor. Make one network with no loose ends, loops, or wires leaving the board. Powered wires are thicker and lit lamps are filled. The menu offers locks, undo and hints. A hint sets one tile correctly and locks it until the puzzle is restarted. To unlock a normal tile, enable Lock mode and select it. There are 600 puzzles: 200 each on 5×5, 7×7 and 9×9 boards. Your puzzle, difficulty and completed puzzles are saved automatically."
