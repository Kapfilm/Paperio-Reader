name: Compile Release
on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build Paperio Reader
        env:
          CROSSPOINT_RELEASE_VERSION: ${{ github.ref_name }}
        run: pio run -e gh_release

      - name: Patch min_chip_rev_full to 0
        run: python3 scripts/patch_min_chip_rev.py .pio/build/gh_release/firmware.bin

      - name: Create branded firmware asset
        run: cp .pio/build/gh_release/firmware.bin ".pio/build/gh_release/firmware-Paperio-Reader-${{ github.ref_name }}.bin"

      - name: Upload release assets
        if: ${{ env.ACT != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Paperio Reader ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          # A hardware-tested firmware.bin may already be attached manually.
          # Keep it byte-for-byte intact instead of replacing it with the CI
          # build, whose release flags can change e-ink sleep timing.
          overwrite_files: false
          files: |
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware-Paperio-Reader-${{ github.ref_name }}.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin
          fail_on_unmatched_files: true
