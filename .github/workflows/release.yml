name: Compile Release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: false

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Build CrossPoint
        run: pio run -e gh_release

      - name: Patch min_chip_rev_full to 0
        run: python3 scripts/patch_min_chip_rev.py .pio/build/gh_release/firmware.bin

      - name: Upload release assets
        if: ${{ env.ACT != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            .pio/build/gh_release/bootloader.bin
            .pio/build/gh_release/firmware.bin
            .pio/build/gh_release/firmware.elf
            .pio/build/gh_release/firmware.map
            .pio/build/gh_release/partitions.bin
          fail_on_unmatched_files: true

  # Build the Total/Double Commander file-system plugin (WFX) for Linux and
  # Windows and attach the installable zips to the release.
  build-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install mingw-w64 cross-compilers + zip
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64 zip

      - name: Build WFX plugin release zips
        run: make -C tools/wfx dist-linux dist-windows

      - name: Upload plugin assets
        if: ${{ env.ACT != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            tools/wfx/dist/crosspoint-usb-wfx-linux-x86_64.zip
            tools/wfx/dist/crosspoint-usb-wfx-windows.zip
          fail_on_unmatched_files: true
